<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="980" height="420" fill="#f7f5f0"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="22" fill="#1f2933">Bus booking deployment</text>
  <text x="32" y="68" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">Local Compose target. Only the proxy is published beyond localhost.</text>

  <rect x="32" y="110" width="150" height="78" rx="8" fill="#ffffff" stroke="#1f2933"/>
  <text x="107" y="145" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1f2933">Client</text>
  <text x="107" y="166" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">curl / browser</text>

  <rect x="250" y="100" width="190" height="98" rx="8" fill="#ffffff" stroke="#1f2933"/>
  <text x="345" y="136" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1f2933">Nginx proxy</text>
  <text x="345" y="158" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">TLS on :8443</text>
  <text x="345" y="176" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">HTTP :8080 redirects</text>

  <rect x="510" y="100" width="200" height="98" rx="8" fill="#ffffff" stroke="#1f2933"/>
  <text x="610" y="136" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1f2933">Reservation API</text>
  <text x="610" y="158" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">FastAPI, uid 10001</text>
  <text x="610" y="176" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">127.0.0.1:8000</text>

  <rect x="780" y="100" width="168" height="98" rx="8" fill="#ffffff" stroke="#1f2933"/>
  <text x="864" y="136" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1f2933">Postgres 16</text>
  <text x="864" y="158" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">role busapp, DML only</text>
  <text x="864" y="176" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#52606d">127.0.0.1:5433</text>

  <path d="M182 149 H250" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M440 149 H510" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M710 149 H780" stroke="#1f2933" stroke-width="1.5"/>

  <rect x="32" y="250" width="430" height="130" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="52" y="280" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1f2933">GitHub Actions</text>
  <text x="52" y="306" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">ruff check and format</text>
  <text x="52" y="328" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">pytest against Postgres</text>
  <text x="52" y="350" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">image tag bus-booking-api:&lt;git sha&gt; plus Trivy</text>

  <rect x="500" y="250" width="448" height="130" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="520" y="280" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1f2933">Seat reservation rule</text>
  <text x="520" y="306" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">One transaction locks the seat row.</text>
  <text x="520" y="328" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">A second confirmed booking for that seat fails.</text>
  <text x="520" y="350" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#52606d">Partial unique index is the database backstop.</text>
</svg>
