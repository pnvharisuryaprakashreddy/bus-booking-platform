name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Dependency scan
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: busbooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d busbooking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/busbooking_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/busbooking_test
      API_KEY: test-key
      APP_VERSION: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: API tests
        run: pytest

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned image
        run: |
          tag="${GITHUB_SHA}"
          docker build --build-arg APP_VERSION="${tag}" -t "bus-booking-api:${tag}" -t bus-booking-api:ci .
          docker image inspect "bus-booking-api:${tag}" --format "repository_tag=bus-booking-api:${tag} image_id={{.Id}}"
      - name: Container scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            bus-booking-api:ci
